  <style>
    :root {
      --tyrkys:  #0E4952;
      --tyrkys-tmavy: #0A363D;
      --pisek:   #FFB067;
      --oranz:   #E2711D;
      --cervena: #C62828;
      --bila:    #FFFFFF;
      --s: 1;
    }

    html, body { margin: 0; height: 100%; font-family: system-ui, "Segoe UI", Roboto, sans-serif; }
    #mapa { height: 100vh; width: 100%; background: #2b2b2b; }

    /* ---------- BADGE MARKERS ---------- */
    .odznak {
      width: 100%; height: 100%;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      border: 3px solid var(--bila);
      box-shadow: 0 2px 6px rgba(0,0,0,.55), 0 0 0 1px rgba(0,0,0,.35);
      transform: scale(var(--s));
      transition: transform .18s ease;
      cursor: pointer;
    }
    .odznak:hover { transform: scale(calc(var(--s) * 1.15)); }
    .odznak svg { width: 62%; height: 62%; display: block; }

    .odznak-sluzby   { background: var(--tyrkys); color: var(--pisek); }
    .odznak-sluzby   svg { fill: var(--pisek); }
    .odznak-aktivity { background: var(--oranz); color: var(--tyrkys-tmavy); }
    .odznak-aktivity svg { fill: var(--tyrkys-tmavy); }
    .odznak-vstup    { background: var(--cervena); color: var(--bila);
                       animation: pulz 2.4s infinite; }
    .odznak-vstup    svg { fill: var(--bila); }
    .odznak-vstup:hover { animation: none; }

    @keyframes pulz {
      0%   { box-shadow: 0 2px 6px rgba(0,0,0,.55), 0 0 0 0 rgba(198,40,40,.65); }
      70%  { box-shadow: 0 2px 6px rgba(0,0,0,.55), 0 0 0 20px rgba(198,40,40,0); }
      100% { box-shadow: 0 2px 6px rgba(0,0,0,.55), 0 0 0 0 rgba(198,40,40,0); }
    }

    /* ---------- POPUP ---------- */
    .leaflet-popup-content-wrapper {
      border-radius: 12px;
      border-top: 5px solid var(--oranz);
      box-shadow: 0 6px 20px rgba(0,0,0,.35);
    }
    .leaflet-popup-content { margin: 12px 14px; min-width: 180px; }
    .pop-nazev {
      font-size: 15px; font-weight: 700; letter-spacing: .3px;
      color: var(--tyrkys); text-transform: uppercase; line-height: 1.25;
    }
    .pop-popis { font-size: 13px; color: #444; margin-top: 4px; }
    .pop-gps {
      font-size: 11px; color: #777; margin-top: 6px;
      font-family: ui-monospace, monospace;
    }
    .pop-nav { margin-top: 10px; display: flex; gap: 6px; flex-wrap: wrap; }
    .pop-nav a {
      flex: 1 1 auto; text-align: center; text-decoration: none;
      font-size: 12px; font-weight: 600; padding: 6px 8px; border-radius: 7px;
      background: var(--tyrkys); color: #fff; white-space: nowrap;
    }
    .pop-nav a:hover { background: var(--oranz); }

    /* ---------- HOVER LABEL (desktop only) ---------- */
    .leaflet-tooltip.stitek {
      background: var(--tyrkys); color: #fff; border: 0;
      border-radius: 6px; font-size: 12px; font-weight: 600;
      padding: 4px 8px; box-shadow: 0 2px 8px rgba(0,0,0,.4);
    }
    .leaflet-tooltip.stitek::before { border-top-color: var(--tyrkys); }
    @media (hover: none) { .leaflet-tooltip.stitek { display: none; } }

    /* ---------- BUTTONS ---------- */
    .tl-btn {
      background: #fff; width: 34px; height: 34px; line-height: 34px;
      text-align: center; font-size: 17px; cursor: pointer;
      border-radius: 6px; box-shadow: 0 1px 5px rgba(0,0,0,.4);
    }
    .tl-btn:hover { background: var(--pisek); }

    /* ---------- LANGUAGE SWITCH ---------- */
    #jazyk {
      display: flex; overflow: hidden;
      border-radius: 8px; box-shadow: 0 1px 5px rgba(0,0,0,.45);
      font-size: 13px; font-weight: 700; letter-spacing: .5px;
      background: #fff; cursor: pointer; user-select: none;
    }
    #jazyk span { padding: 7px 12px; color: var(--tyrkys); transition: background .15s; }
    #jazyk span:hover { background: var(--pisek); }
    #jazyk span.aktivni { background: var(--tyrkys); color: #fff; }
    #jazyk span.aktivni:hover { background: var(--tyrkys); }

    /* ---------- LEGEND (off by default) ---------- */
    #legenda {
      background: rgba(14,73,82,.94); color: #fff; padding: 10px 12px;
      border-radius: 10px; font-size: 12px; line-height: 1.7;
      box-shadow: 0 2px 10px rgba(0,0,0,.4);
    }
    #legenda i { display: inline-block; width: 12px; height: 12px; border-radius: 50%;
      margin-right: 7px; border: 2px solid #fff; vertical-align: -2px; }

  const osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    { maxZoom: 19, attribution: '&copy; OpenStreetMap' });

  const mapa = L.map('mapa', { layers: [cuzkOrtofoto], maxZoom: 20 });

  // ---------- 5. SITE EXTENT (no longer drawn - used only to frame the view) ----------
  // The orange outline was removed on request. These four corners stay so the
  // map still knows where to zoom on load. Nothing is painted from them.
  const hraniceArealu = [
    [50.249444, 14.846472],  // NW
    [50.249806, 14.859556],  // NE
    [50.241056, 14.863528],  // SE
    [50.239333, 14.849833]   // SW
  ];
  const rozsahArealu = L.latLngBounds(hraniceArealu);

  // ---------- 5b. WALKING PATH: main gate -> main entrance ----------
  // Surveyed on the ortofoto. First point = main gate, last = main entrance.
  // ~850 m. Two clicks were reordered: the gate itself was point 2 in the raw
  // survey, and a 5 m spur just before the entrance was dropped.
  const CESTA = [
    [50.2464631, 14.8590603],  // Hlavní vjezd / Main gate
    [50.2466331, 14.8589347],
    [50.2472317, 14.8584553],
    [50.2469567, 14.8561794],
    [50.2470356, 14.8552039],
    [50.2473172, 14.8547414],
    [50.2475725, 14.8541364],
    [50.2480831, 14.8527717],
    [50.2477961, 14.8515244],
    [50.2472925, 14.8495675],
    [50.2472240, 14.8486370]   // Hlavní vstup / Main entrance
  ];

  // white casing underneath so the line reads on grass, gravel and asphalt alike
  L.polyline(CESTA, {
    color: '#FFFFFF', weight: 10, opacity: .85,
    lineCap: 'round', lineJoin: 'round', interactive: false
  }).addTo(mapa);

  // orange dotted trail on top
  const cesta = L.polyline(CESTA, {
    color: '#E2711D', weight: 5, opacity: 1,
    dashArray: '1 13', lineCap: 'round', lineJoin: 'round'
  }).addTo(mapa);

  // ---------- 6. MARKERS ----------
  function obsahPopupu(b) {
    const [nazev, popis] = b[jazyk];
    const gmaps  = `https://www.google.com/maps/dir/?api=1&destination=${b.lat},${b.lng}`;
    const mapycz = `https://mapy.cz/zakladni?x=${b.lng}&y=${b.lat}&z=18&source=coor&id=${b.lng},${b.lat}`;
    const waze   = `https://waze.com/ul?ll=${b.lat},${b.lng}&navigate=yes`;
    return `
      <div class="pop-nazev">${nazev}</div>
      ${popis ? `<div class="pop-popis">${popis}</div>` : ''}
      <div class="pop-gps">${b.lat}, ${b.lng}</div>
      <div class="pop-nav">
        <a href="${gmaps}" target="_blank" rel="noopener">Google</a>
        <a href="${mapycz}" target="_blank" rel="noopener">Mapy.cz</a>
        <a href="${waze}" target="_blank" rel="noopener">Waze</a>
      </div>`;
  }

  const znacky = BODY.map(b => {
    const velikost = (b.typ === 'vstup') ? 44 : 36;
    const html = `<div class="odznak odznak-${b.typ}">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">${IKONY[b.ikona]}</svg>
      </div>`;
    const m = L.marker([b.lat, b.lng], {
      icon: L.divIcon({
        className: '', html,
        iconSize: [velikost, velikost],
        iconAnchor: [velikost / 2, velikost / 2],
        popupAnchor: [0, -velikost / 2]
      }),
      riseOnHover: true,
      zIndexOffset: b.typ === 'vstup' ? 1000 : (b.typ === 'aktivity' ? 500 : 0)
    })
    .bindPopup(obsahPopupu(b))
    .bindTooltip(b[jazyk][0], { direction: 'top', offset: [0, -velikost / 2], className: 'stitek' })
    .addTo(mapa);
    m._data = b;
    return m;
  });

  L.control.scale({ imperial: false }).addTo(mapa);
  mapa.fitBounds(rozsahArealu, { padding: [24, 24] });

  // ---------- 7. LANGUAGE SWITCH ----------
  let ovladacVrstev, ovladacLegendy;

  function prepniJazyk(novy) {
    if (novy === jazyk) return;
    jazyk = novy;
    prekresliTexty();
    // keep the URL shareable and iframe-friendly
    const u = new URL(location.href);
    u.searchParams.set('lang', jazyk);
    history.replaceState(null, '', u);
  }

  function prekresliTexty() {
    const t = UI[jazyk];

    document.documentElement.lang = jazyk;
    document.title = t.titulek;

    cesta.bindTooltip(t.cesta, { sticky: true, className: 'stitek' });
    cesta.bindPopup(`<div class="pop-nazev">${t.cesta}</div><div class="pop-popis">${t.cestaPopis}</div>`);

    znacky.forEach(m => {
      m.setPopupContent(obsahPopupu(m._data));
      m.setTooltipContent(m._data[jazyk][0]);
    });

    // rebuild the base map switcher with translated names
    if (ovladacVrstev) mapa.removeControl(ovladacVrstev);
    ovladacVrstev = L.control.layers({
      [t.ortofoto]: cuzkOrtofoto,
      [t.satelit]:  esriSatelit,
      [t.mapa]:     osm
    }, null, { position: 'topright' }).addTo(mapa);

    // rebuild the legend
    if (ovladacLegendy) { mapa.removeControl(ovladacLegendy); ovladacLegendy = null; }
    if (ZOBRAZIT_LEGENDU) {
      ovladacLegendy = L.control({ position: 'bottomleft' });
      ovladacLegendy.onAdd = function () {
        const d = L.DomUtil.create('div', '');
        d.id = 'legenda';
        d.innerHTML = `<i style="background:#C62828"></i>${t.legVstupy}<br>` +
                      `<i style="background:#E2711D"></i>${t.legAktivity}<br>` +
                      `<i style="background:#0E4952"></i>${t.legZazemi}`;
        return d;
      };
      ovladacLegendy.addTo(mapa);
    }

    // locate button tooltip
    const tlacitkoPolohy = document.querySelector('.tl-btn');
    if (tlacitkoPolohy) tlacitkoPolohy.title = t.kdeJsem;

    // active state of the CZ|EN pill
    document.querySelectorAll('#jazyk span').forEach(s => {
      s.classList.toggle('aktivni', s.dataset.jazyk === jazyk);
    });
  }

  const Prepinac = L.Control.extend({
    options: { position: 'topright' },
    onAdd() {
      const d = L.DomUtil.create('div', '');
      d.id = 'jazyk';
      d.innerHTML = '<span data-jazyk="cs">CZ</span><span data-jazyk="en">EN</span>';
      L.DomEvent.disableClickPropagation(d);
      d.addEventListener('click', e => {
        const s = e.target.closest('span');
        if (s) prepniJazyk(s.dataset.jazyk);
      });
      return d;
    }
  });
  mapa.addControl(new Prepinac());

  // ---------- 8. "WHERE AM I" ----------
  const Poloha = L.Control.extend({
    options: { position: 'topleft' },
    onAdd() {
      const b = L.DomUtil.create('div', 'tl-btn');
      b.innerHTML = '&#9678;';
      b.title = UI[jazyk].kdeJsem;
      L.DomEvent.on(b, 'click', L.DomEvent.stop)
                .on(b, 'click', () => mapa.locate({ setView: true, maxZoom: 18 }));
      return b;
    }
  });
  mapa.addControl(new Poloha());

  let znackaPolohy;
  mapa.on('locationfound', e => {
    if (znackaPolohy) mapa.removeLayer(znackaPolohy);
    znackaPolohy = L.circleMarker(e.latlng, {
      radius: 8, color: '#fff', weight: 3, fillColor: '#1565c0', fillOpacity: 1
    }).addTo(mapa).bindPopup(UI[jazyk].jstuZde).openPopup();
  });
  mapa.on('locationerror', () => alert(UI[jazyk].chybaPolohy));

  // ---------- 9. BADGE SIZE BY ZOOM ----------
  function prizpusobVelikost() {
    const z = mapa.getZoom();
    const s = z >= 17 ? 1 : z >= 16 ? .88 : z >= 15 ? .74 : .6;
    document.documentElement.style.setProperty('--s', s);
  }
  mapa.on('zoomend', prizpusobVelikost);
  prizpusobVelikost();

  // ---------- 10. FIRST PAINT ----------
  prekresliTexty();

  // ---------- 11. COORDINATE PICKER ----------
  if (REZIM_LADENI) {
    mapa.on('click', e => {
      const lat = e.latlng.lat.toFixed(6), lng = e.latlng.lng.toFixed(6);
      L.popup().setLatLng(e.latlng).setContent(`[${lat}, ${lng}]`).openOn(mapa);
      console.log(`[${lat}, ${lng}],`);
    });
  }
  </script>
</body>
</html>
